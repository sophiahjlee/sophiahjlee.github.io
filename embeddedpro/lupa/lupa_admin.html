<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LUPA 관리자 현황</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>

:root{
  --bg:#ffffff;
  --surface:#ffffff;
  --surface2:#f4f6f8;
  --line:#e6e9ed;
  --line2:#d3d8df;
  --ink:#14171c;
  --ink2:#545b67;
  --ink3:#878e9a;
  --brand:#d81b50;
  --brand-dark:#a81340;
  --ok:#0a7a55;
  --ok-bg:#e9f5f0;
  --brand-bg:#fdf1f5;
  --r:12px;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:"IBM Plex Sans KR",sans-serif;
}

.wrap{
  max-width:1300px;
  margin:auto;
  padding:28px;
}

.top{
  border-bottom:1px solid var(--line);
  background:#fff;
}

.top-inner{
  height:64px;
  display:flex;
  align-items:center;
  gap:12px;
}

.mark{
  width:32px;
  height:32px;
  border-radius:10px;
  background:var(--brand);
  color:#fff;
  display:grid;
  place-items:center;
  font-weight:700;
  font-size:11px;
}

.title{
  font-size:15px;
  font-weight:700;
}

.hero{
  margin-top:24px;
}

.hero h1{
  font-size:34px;
  color:var(--brand);
  margin:0;
}

.hero p{
  color:var(--ink2);
  margin-top:10px;
}

.cards{
  display:grid;
  grid-template-columns:
    repeat(auto-fit,minmax(220px,1fr));
  gap:16px;
  margin-top:24px;
}

.card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:var(--r);
  padding:20px;
}

.k-title{
  color:var(--ink3);
  font-size:13px;
}

.k-value{
  font-size:32px;
  font-weight:700;
  margin-top:8px;
}

.search{
  width:100%;
  margin-top:24px;
  height:44px;
  border:1px solid var(--line2);
  border-radius:10px;
  padding:0 14px;
  font:inherit;
}

.tbl-wrap{
  margin-top:20px;
  border:1px solid var(--line);
  border-radius:12px;
  overflow:hidden;
}

table{
  width:100%;
  border-collapse:collapse;
}

thead{
  background:#fafafa;
}

th{
  text-align:left;
  padding:14px;
  color:var(--ink3);
  font-size:12px;
}

td{
  padding:14px;
  border-top:1px solid var(--line);
}

tbody tr:hover{
  background:#fafafa;
}

.progress{
  font-weight:700;
}

.progress.high{
  color:var(--ok);
}

.progress.mid{
  color:var(--brand);
}

.badge{
  display:inline-block;
  padding:4px 10px;
  border-radius:999px;
  font-size:12px;
  font-weight:600;
}

.badge.done{
  background:var(--ok-bg);
  color:var(--ok);
}

.badge.going{
  background:var(--brand-bg);
  color:var(--brand);
}

.badge.none{
  background:var(--surface2);
  color:var(--ink3);
}

</style>
</head>

<body>

<header class="top">
  <div class="wrap">
    <div class="top-inner">
      <div class="mark">ESP</div>
      <div class="title">
        Embedded SW Professional
      </div>
    </div>
  </div>
</header>

<div class="wrap">

  <div class="hero">
    <h1>학습 현황 대시보드</h1>
    <p>
      Embedded SW Professional 전체 학습 현황
    </p>
  </div>

  <div class="cards">

    <div class="card">
      <div class="k-title">전체 학습자</div>
      <div class="k-value" id="userCnt">0</div>
    </div>

    <div class="card">
      <div class="k-title">학습 시작</div>
      <div class="k-value" id="startedCnt">0</div>
    </div>

    <div class="card">
      <div class="k-title">50% 이상</div>
      <div class="k-value" id="halfCnt">0</div>
    </div>

    <div class="card">
      <div class="k-title">100% 완료</div>
      <div class="k-value" id="doneCnt">0</div>
    </div>

  </div>

  <input
    id="search"
    class="search"
    placeholder="이름 또는 조직 검색..."
  >

  <div class="tbl-wrap">

    <table>

      <thead>
        <tr>
          <th>이름</th>
          <th>조직</th>
          <th>진도율</th>
          <th>완료강의</th>
          <th>상태</th>
          <th>최근학습</th>
        </tr>
      </thead>

      <tbody id="tbody">
      </tbody>

    </table>

  </div>
    <div id="detail"></div>

    </div>  

</div>

<script>

let USERS = [];

function calc(user){

  let total = 0;
  let done = 0;
  let doneLecture = 0;
  let totalLecture = 0;
  let latest = '';

  Object.values(
    user.lectures || {}
  ).forEach(l=>{

    totalLecture++;

    total += l.total || 0;

    done +=
      (l.done || []).length;

    if(
      (l.done || []).length >=
      (l.total || 0)
    ){
      doneLecture++;
    }

    if(
      l.updatedAt &&
      l.updatedAt > latest
    ){
      latest = l.updatedAt;
    }

  });

  return {
    pct:
      total
      ? Math.round(
          done /
          total *
          100
        )
      : 0,

    doneLecture,
    totalLecture,
    latest
  };
}

function render(users){

  let started = 0;
  let half = 0;
  let completed = 0;

  let html = '';

  users.forEach(u=>{

    const s = calc(u);

    if(s.pct > 0)
      started++;

    if(s.pct >= 50)
      half++;

    if(s.pct >= 100)
      completed++;

    let badge='';

    if(s.pct >= 100){

      badge =
      '<span class="badge done">완료</span>';

    }else if(s.pct > 0){

      badge =
      '<span class="badge going">학습중</span>';

    }else{

      badge =
      '<span class="badge none">미시작</span>';

    }

    html += `
    <tr
        style="cursor:pointer"
        onclick="showDetail('${u.uid}')"
    >

        <td>${u.name || ''}</td>

        <td>${u.dept || ''}</td>

        <td class="progress ${s.pct >= 100 ? 'high' : s.pct > 0 ? 'mid' : ''}">
          ${s.pct}%
        </td>

        <td>
          ${s.doneLecture}/${s.totalLecture}
        </td>

        <td>
          ${badge}
        </td>

        <td>
          ${
            s.latest
              ? s.latest.substring(0,10)
              : '-'
          }
        </td>

      </tr>
    `;
  });

  document.getElementById(
    'tbody'
  ).innerHTML = html;

  document.getElementById(
    'userCnt'
  ).textContent =
    users.length;

  document.getElementById(
    'startedCnt'
  ).textContent =
    started;

  document.getElementById(
    'halfCnt'
  ).textContent =
    half;

  document.getElementById(
    'doneCnt'
  ).textContent =
    completed;
}

async function load(){

  const res =
    await fetch(
      '/progress-list',
      {
        cache:'no-store'
      }
    );

  USERS =
    Object.values(
      await res.json()
    );

  USERS.sort(
    (a,b)=>
      calc(b).pct -
      calc(a).pct
  );

  render(USERS);
}

document
  .getElementById('search')
  .addEventListener(
    'input',
    function(){

      const q =
        this.value
          .trim()
          .toLowerCase();

      const filtered =
        USERS.filter(u =>

          (u.name || '')
            .toLowerCase()
            .includes(q)

          ||

          (u.dept || '')
            .toLowerCase()
            .includes(q)

        );

      render(filtered);

    }
  );

load();
function showDetail(uid){

  const user =
    USERS.find(
      u => u.uid === uid
    );

  if(!user) return;

  const lectures =
    Object.values(
      user.lectures || {}
    );

  let rows = '';

  lectures.forEach(l => {

    const done =
      (l.done || []).length;

    const total =
      l.total || 0;

    const pct =
      total
      ? Math.round(
          done / total * 100
        )
      : 0;

    rows += `
      <tr>
        <td>${l.lecture}</td>
        <td>${done}/${total}</td>
        <td>${pct}%</td>
      </tr>
    `;
  });

  document
    .getElementById('detail')
    .innerHTML = `

      <div
        class="card"
        style="margin-top:24px"
      >

        <h2>
          ${user.name}
        </h2>

        <p>
          ${user.dept || ''}
        </p>

        <table style="margin-top:16px">

          <thead>
            <tr>
              <th>강의</th>
              <th>진행</th>
              <th>진도율</th>
            </tr>
          </thead>

          <tbody>
            ${rows}
          </tbody>

        </table>

      </div>

    `;
}
</script>

</body>
</html>
