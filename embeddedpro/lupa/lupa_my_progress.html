<!DOCTYPE html>
<html lang="ko">
<!-- 본인 진도 조회.
     기존 embeddedpro/result_score.html 과 같은 방식이다 — 저장소에 올려둔 JSON 을 fetch 해서
     식별자로 본인 행만 보여준다. 쓰기 경로는 없다.
       · lupa_progress.json : Google Sheets(수집분)에서 내려받아 커밋한다
       · 식별자            : 사내 메일 아이디 (강의 페이지 진도 키와 동일)
     JSON 이 아직 없으면 안내만 보여주고 조용히 끝낸다. -->
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>LUPA 학습 진도 조회</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #FFFFFF; --surface: #FFFFFF; --surface-2: #F4F6F8;
    --line: #E6E9ED; --line-2: #D3D8DF;
    --ink: #14171C; --ink-2: #545B67; --ink-3: #878E9A;
    --brand: #D81B50; --brand-ink: #A81340; --brand-wash: #FDF1F5;
    --ok: #0A7A55; --ok-wash: #E9F5F0;
    --r: 12px; --r-sm: 8px; --r-xs: 6px;
    --sys: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    --font: "IBM Plex Sans KR", var(--sys);
    --mono: "JetBrains Mono", "SF Mono", ui-monospace, monospace;
  }
  body {
    font-family: var(--font); background: var(--bg); color: var(--ink); line-height: 1.6;
    -webkit-font-smoothing: antialiased; word-break: keep-all;
  }
  :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 4px; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 28px; }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

  .top { border-bottom: 1px solid var(--line); }
  .top .wrap { display: flex; align-items: center; gap: 11px; height: 60px; }
  .mark {
    width: 30px; height: 30px; flex: 0 0 30px; border-radius: 9px; background: var(--brand);
    color: #fff; display: grid; place-items: center; font-size: 10px; font-weight: 700;
  }
  .wordmark { font-size: 14.5px; font-weight: 700; letter-spacing: -0.01em; }
  .top .spacer { flex: 1; }
  .top a { font-size: 12.5px; font-weight: 600; color: var(--ink-2); text-decoration: none; }
  .top a:hover { color: var(--brand); }

  h1 { margin-top: 44px; font-size: 26px; font-weight: 700; letter-spacing: -0.025em; }
  .desc { margin-top: 12px; font-size: 14px; color: var(--ink-2); line-height: 1.7; }

  .form { display: flex; gap: 8px; margin-top: 26px; flex-wrap: wrap; }
  .mail-row { position: relative; flex: 1 1 260px; }
  .mail-row input {
    width: 100%; height: 44px; padding: 0 92px 0 14px; border-radius: var(--r-sm);
    border: 1px solid var(--line-2); background: var(--surface); color: var(--ink);
    font: inherit; font-size: 14px; outline: none;
  }
  .mail-row input:focus { border-color: var(--brand); }
  .mail-dom {
    position: absolute; right: 14px; top: 0; height: 44px; display: flex; align-items: center;
    font-size: 13.5px; color: var(--ink-3); pointer-events: none;
  }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 7px; font: inherit;
    font-size: 13px; font-weight: 600; cursor: pointer; height: 44px; padding: 0 18px;
    border-radius: var(--r-sm); border: 1px solid var(--brand); background: var(--brand); color: #fff;
  }
  .btn:hover { background: var(--brand-ink); border-color: var(--brand-ink); }

  .msg { margin-top: 18px; font-size: 13.5px; color: var(--ink-2); }
  .msg.warn { color: var(--brand); }

  .card {
    margin-top: 26px; padding: 22px; background: var(--surface);
    border: 1px solid var(--line); border-radius: var(--r);
  }
  .who { display: flex; align-items: center; gap: 12px; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
  .ring {
    width: 52px; height: 52px; flex: 0 0 52px; border-radius: 50%; display: grid; place-items: center;
    background: conic-gradient(var(--brand) var(--p, 0%), var(--surface-2) 0);
  }
  .ring span {
    width: 42px; height: 42px; border-radius: 50%; background: var(--surface); display: grid; place-items: center;
    font-family: var(--mono); font-size: 12px; font-weight: 700;
  }
  .who b { display: block; font-size: 15px; font-weight: 600; }
  .who em { font-style: normal; font-size: 12.5px; color: var(--ink-3); }

  table { width: 100%; border-collapse: collapse; margin-top: 6px; }
  th, td { text-align: left; padding: 11px 8px; border-bottom: 1px solid var(--line); font-size: 13.5px; }
  th { font-size: 11.5px; font-weight: 700; letter-spacing: 0.06em; color: var(--ink-3); }
  td.num { font-family: var(--mono); font-variant-numeric: tabular-nums; color: var(--ink-2); white-space: nowrap; }
  .bar { display: block; width: 90px; height: 4px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--brand); }
  tr.done .bar i { background: var(--ok); }
  .chip { font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 99px; white-space: nowrap; }
  .chip.done { background: var(--ok-wash); color: var(--ok); }
  .chip.going { background: var(--brand-wash); color: var(--brand); }
  .chip.none { background: var(--surface-2); color: var(--ink-3); }

  .foot { margin: 34px 0 60px; font-size: 12px; color: var(--ink-3); line-height: 1.7; }
  @media (max-width: 620px) {
    .wrap { padding: 0 18px; }
    h1 { font-size: 22px; }
    .bar { width: 56px; }
  }
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <span class="mark">ESP</span>
    <span class="wordmark">Embedded SW Professional</span>
    <span class="spacer"></span>
    <a href="lupa_index.html">← 강의 목록</a>
  </div>
</header>

<div class="wrap">
  <h1>학습 진도 조회</h1>
  <p class="desc">현재까지의 학습 진도를 확인할 수 있습니다.</p>

  <!-- <form class="form" id="form" autocomplete="off">
    <label class="mail-row">
      <input id="uid" placeholder="메일 아이디 (예: sophiahj.lee)" maxlength="40" spellcheck="false">
      <span class="mail-dom">@lge.com</span>
    </label>
    <button type="submit" class="btn">조회</button>
  </form> -->

  <div class="msg" id="msg"></div>
  <div id="result"></div>

  <p class="foot">
    문의는 교육 담당자에게 주세요. 이 페이지는 조회 전용이며 진도를 수정하지 않습니다.
  </p>
</div>

<script>

function esc(s){
  return String(s || '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

function say(text, warn){

  const el =
    document.getElementById('msg');

  if(!el) return;

  el.textContent =
    text || '';

  el.className =
    'msg' +
    (warn ? ' warn' : '');
}

async function loadMy(){

  try{

    const uid =
      localStorage.getItem(
        'lupa_uid'
      );

    if(!uid){

      say(
        '먼저 강의 목록에서 사용자를 선택해 주세요.',
        true
      );

      return;
    }

    const res =
      await fetch(
        '/progress-list',
        {
          cache:'no-store'
        }
      );

    if(!res.ok){
      throw new Error(
        res.status
      );
    }

    const data =
      await res.json();

    const rec =
      data[uid];

    if(!rec){

      say(
        '저장된 학습 정보가 없습니다.',
        true
      );

      return;
    }

    render(rec);

  }
  catch(e){

    console.error(e);

    say(
      '진도 데이터를 불러올 수 없습니다.',
      true
    );

  }
}

function render(rec){

  const lectures =
    Object.values(
      rec.lectures || {}
    );

  let doneCh = 0;
  let allCh = 0;
  let doneLec = 0;

  let rows = '';

  lectures.forEach(L => {

    const total =
      L.total || 0;

    const done =
      (L.done || []).length;

    const pct =
      total
        ? Math.round(
            done / total * 100
          )
        : 0;

    const finished =
      total > 0 &&
      done >= total;

    doneCh += done;
    allCh += total;

    if(finished)
      doneLec++;

    const chip =
      finished
        ? '<span class="chip done">완료</span>'
        : done > 0
          ? '<span class="chip going">학습 중</span>'
          : '<span class="chip none">미시작</span>';

    rows += `
      <tr ${finished ? 'class="done"' : ''}>
        <td>${esc(L.lecture)}</td>
        <td class="num">${done} / ${total}</td>
        <td>
          <span class="bar">
            <i style="width:${pct}%"></i>
          </span>
        </td>
        <td class="num">${pct}%</td>
        <td>${chip}</td>
      </tr>
    `;
  });

  const totalPct =
    allCh
      ? Math.round(
          doneCh / allCh * 100
        )
      : 0;

  document.getElementById(
    'result'
  ).innerHTML = `

    <div class="card">

      <div class="who">

        <div
          class="ring"
          style="--p:${totalPct}%"
        >
          <span>${totalPct}%</span>
        </div>

        <div>

          <b>${esc(rec.name)}</b>

          <em>

            ${esc(rec.uid)}@lge.com

            ${
              rec.dept
              ? ' · ' + esc(rec.dept)
              : ''
            }

            · 강의 ${doneLec}/${lectures.length}

          </em>

        </div>

      </div>

      <table>

        <thead>
          <tr>
            <th>강의</th>
            <th>챕터</th>
            <th>진도</th>
            <th>%</th>
            <th>상태</th>
          </tr>
        </thead>

        <tbody>
          ${rows}
        </tbody>

      </table>

    </div>

  `;
}

window.addEventListener(
  'DOMContentLoaded',
  loadMy
);

</script>
</body>
</html>
